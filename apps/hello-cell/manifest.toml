# hello-cell's declared ceiling (spec 034 B-1). What is not here is denied,
# and every denial is a record in the chain (constitution X).
#
# `db.migrate` on `notes` is deliberately absent: the notes service reaches
# for it through `POST /api/notes/migrate`, the kernel refuses, and the
# end-to-end test reads the decision id off the 403. That is the
# demonstration, not an oversight.

schema_version = "1.0.0"

[app]
name = "hello-cell"
org = "statecrafting"

[resources]
tables = ["notes"]
kv = ["hello"]

[[capabilities]]
id = "notes-read"
kind = "db.read"
resource = "notes"

[[capabilities]]
id = "notes-write"
kind = "db.write"
resource = "notes"

[[capabilities]]
id = "notes-txn"
kind = "db.txn"
resource = "notes"

[[capabilities]]
id = "hello-get"
kind = "kv.get"
resource = "hello"
constraints = { key_prefix = "hello:" }

[[capabilities]]
id = "hello-put"
kind = "kv.put"
resource = "hello"
constraints = { key_prefix = "hello:" }

[[capabilities]]
id = "note-publish"
kind = "notify.publish"
resource = "notes"

[services.notes]
capabilities = [
  "notes-read",
  "notes-write",
  "notes-txn",
  "hello-get",
  "hello-put",
  "note-publish",
]

[gate]
checks = ["secrets"]

[ledger]
schema_version = "1.0.0"
max_record_bytes = 65536

[observability]
metrics_path = "/metrics"
otel = false

[auth]
operator_role = "hello_operator"
# Spec 038 B-4: the lifetimes this cell fixes, said out loud rather than
# left to rauthy's defaults (1800 seconds, and 72 hours for a device
# grant's refresh token). The access lifetime is also what the revocation
# deny-list's memory is computed from (038 D-7).
access_token_lifetime_secs = 600
native_refresh_lifetime_secs = 86400

# Spec 038 B-7: the command-line client. Public, so it keeps no secret; the
# device grant, so it logs a person in from a terminal; the refresh grant,
# so it renews without asking them again. `notes:write` is the scope the
# bearer route at POST /api/v1/notes requires, and declaring one no route
# requires is refused at boot (038 B-2).
[[auth.native_clients]]
id = "hello-cli"
flows = ["device_code", "refresh_token"]
scopes = ["notes:write"]

[contract]
version = "1.0.0"
