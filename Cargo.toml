# The rahi workspace (spec 010 B-1). Every third-party version lives in
# [workspace.dependencies]; adding one is an `extends` edge on that section.

[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/rahi"
authors = ["Bartek Kus"]

[workspace.dependencies]
rahi-types = { path = "crates/rahi-types", version = "0.1.0" }
rahi-store = { path = "crates/rahi-store", version = "0.1.0" }
rahi-ledger = { path = "crates/rahi-ledger", version = "0.1.0" }
rahi-kernel = { path = "crates/rahi-kernel", version = "0.1.0" }
rahi-edge = { path = "crates/rahi-edge", version = "0.1.0" }
rahi-idp = { path = "crates/rahi-idp", version = "0.1.0" }
rahi-ops = { path = "crates/rahi-ops", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hiqlite = { version = "0.14", default-features = false, features = ["sqlite", "cache", "counters", "dlock", "listen_notify_local", "backup", "s3"] }
futures-core = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }
tempfile = "3"
# The statecrafting ledger primitives (spec 013): the record envelope, the
# hashing and verification engine, and the canonical bytes both hash over.
attest-ledger-types = "0.1"
attest-ledger-core = "0.1"
canonical-keysort-json = "0.1"
ed25519-dalek = "3"
base64 = "0.22"
# The segment archive (spec 014): a dyn-compatible async trait needs boxed
# futures, and the object store is the S3 client hiqlite already carries,
# reached through a parsed endpoint.
async-trait = "0.1"
s3-simple = "0.8"
url = "2"

# The kernel (spec 015): the declared manifest is TOML, and adjudication is
# the action-gate primitive: a pure gate over an ordered check registry with a
# stable config hash the manifest hash folds in.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
action-gate-types = "0.1"
action-gate-core = { version = "0.1", features = ["checks-common"] }

# Binary values (spec 016): the store's own path carries bytes without it,
# and the test that a BLOB column lands in a `serde_bytes::ByteBuf` field
# needs the type spec 016 B-1 names.
serde_bytes = "0.11"

# The edge (spec 020): axum is the one listener, tower-http serves the static
# slot, and the CSRF token draws its bytes from the operating system. axum and
# tower-http are already in the tree under hiqlite, and the versions here are
# the ones already locked, so the edge adds no second copy of the HTTP stack.
axum = { version = "0.8" }
tower = { version = "0.5" }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
getrandom = "0.4"

# Identity (specs 021 and 022): rauthy is reached over loopback only, so the
# client is built without a TLS backend at all. `stream` is what keeps the
# proxy from buffering a body in either direction, and `form` is how the token
# and revocation endpoints are addressed: OAuth 2 posts
# `application/x-www-form-urlencoded` and nothing else. reqwest is already in
# the tree under hiqlite at this version, so this adds no second HTTP client.
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "form"] }

# Sessions (spec 022): one primitive library covers all three of this spec's
# cryptographic needs. HMAC-SHA256 seals the session envelope, SHA-256 is the
# PKCE S256 challenge, and RSA PKCS#1 v1.5 verification reads the modulus and
# exponent a JWK publishes, which is the form rauthy's key set arrives in.
# ring is already compiled in this tree under hiqlite's TLS stack, so this
# adds no second cryptographic backend.
ring = "0.17"

# Observability (spec 023): a process-wide Prometheus registry rendered as
# text (the protobuf exposition is off, nothing scrapes it), and the
# OpenTelemetry stack behind `tracing`. The tracer is always in-process; the
# OTLP exporter is built only when an endpoint is configured.
prometheus = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }

# The verbs (spec 030): one backup is one tar stream sealed with age to the
# deployment's backup recipient, so the stores never travel without the key
# that reads them (constitution XII). Both are pure Rust and add no second
# copy of a primitive already in the tree.
tar = "0.4"
age = { version = "0.12", default-features = false }
# Preflight (spec 030 B-3) reads the volume's free space; std has no call
# for it and the workspace forbids unsafe, so a thin wrapper carries it.
fs4 = "1"
# The supervisor (spec 031 B-3) sends SIGTERM to its child; std can only
# SIGKILL, and the workspace forbids the unsafe libc call, so nix carries it.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
float_arithmetic = "deny"
