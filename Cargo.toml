# The rahi workspace (spec 010 B-1). Every third-party version lives in
# [workspace.dependencies]; adding one is an `extends` edge on that section.

[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/rahi"
authors = ["Bartek Kus"]

[workspace.dependencies]
rahi-types = { path = "crates/rahi-types", version = "0.1.0" }
rahi-store = { path = "crates/rahi-store", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hiqlite = { version = "0.14", default-features = false, features = ["sqlite", "cache", "counters", "dlock", "listen_notify_local", "backup", "s3"] }
futures-core = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }
tempfile = "3"
# The statecrafting ledger primitives (spec 013): the record envelope, the
# hashing and verification engine, and the canonical bytes both hash over.
attest-ledger-types = "0.1"
attest-ledger-core = "0.1"
canonical-keysort-json = "0.1"
ed25519-dalek = "3"
base64 = "0.22"
# The segment archive (spec 014): a dyn-compatible async trait needs boxed
# futures, and the object store is the S3 client hiqlite already carries,
# reached through a parsed endpoint.
async-trait = "0.1"
s3-simple = "0.8"
url = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
float_arithmetic = "deny"
