# The rahi workspace (spec 010 B-1). Every third-party version lives in
# [workspace.dependencies]; adding one is an `extends` edge on that section.

[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/rahi"
authors = ["Bartek Kus"]

[workspace.dependencies]
rahi-types = { path = "crates/rahi-types", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hiqlite = { version = "0.14", default-features = false, features = ["sqlite", "cache", "dlock", "listen_notify_local", "backup", "s3"] }
tokio = { version = "1", default-features = false }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
float_arithmetic = "deny"
