[package]
name = "rahi-ops"
version = "0.1.0"
description = "The operational verbs of the rahi chassis: preflight, migrate, backup, restore, and ledger verify"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.spec-spine]
spec = "030-operational-verbs"

[dependencies]
rahi-types = { workspace = true }
rahi-store = { workspace = true }
rahi-ledger = { workspace = true }
rahi-kernel = { workspace = true }
rahi-idp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
fs4 = { workspace = true }
getrandom = { workspace = true }
nix = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
age = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "signal", "time"] }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
