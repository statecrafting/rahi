[package]
name = "rahi-cli"
version = "0.1.0"
description = "The binary composer of the rahi chassis: a Cell becomes serve plus every operational verb"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.spec-spine]
spec = "030-operational-verbs"

[[bin]]
name = "rahi"
path = "src/main.rs"

[dependencies]
rahi-types = { workspace = true }
rahi-store = { workspace = true }
rahi-ledger = { workspace = true }
rahi-kernel = { workspace = true }
rahi-edge = { workspace = true }
rahi-idp = { workspace = true }
rahi-ops = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
