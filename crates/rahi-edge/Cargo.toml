[package]
name = "rahi-edge"
version = "0.1.0"
description = "The edge of the rahi chassis: one axum router, a fixed middleware order, probes, a static slot, and one error mapping"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.spec-spine]
spec = "020-edge-server"

[dependencies]
rahi-types = { workspace = true }
rahi-store = { workspace = true }
rahi-ledger = { workspace = true }
rahi-kernel = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
prometheus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
# Streaming (spec 026): the response body is a hand-rolled `Stream` over a
# bounded channel, so the trait is named here; nothing else is added.
futures-core = { workspace = true }

# The process collector reads /proc, so it exists where a cell actually runs
# and is absent on a developer's macOS box (spec 023 D-2).
[target.'cfg(target_os = "linux")'.dependencies]
prometheus = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
