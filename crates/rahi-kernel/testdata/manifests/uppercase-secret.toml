# An uppercase secret name (spec 015 FR-001). Two spellings of one resource
# are two holes in one ceiling, so names are lowercase everywhere, including
# the ones that look like environment variables.

[app]
name = "hello-cell"
org = "statecrafting"

[resources]
secrets = ["WEBHOOK_TOKEN"]

[[capabilities]]
id = "webhook-secret"
kind = "secret.read"
resource = "WEBHOOK_TOKEN"

[services.webhooks]
capabilities = ["webhook-secret"]

[ledger]
schema_version = "1.0.0"
max_record_bytes = 65536

[observability]
metrics_path = "/metrics"
otel = false

[auth]
operator_role = "rahi-operator"

[contract]
version = "1.0.0"
