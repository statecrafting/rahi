# Version-pin bumps self-waive the coupling gate (spec-spine's
# auto_waive_dependency_only), so these PRs need no spec edit.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # No npm anywhere in this repository (spec 001 D-1), so no npm entry.
  # The cargo entry reports "no manifest" until spec 010 lands Cargo.toml.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
