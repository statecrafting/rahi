# The image workflow (spec 031 B-6): build the container on main and on
# tags, smoke it against a real rauthy, and push it on tags only.
#
# This workflow publishes no PR status check and sits outside the ci-gate
# chain (spec 001 D-9): a release artifact is built after the gate, not as
# part of it. Each architecture builds on its own native runner, which is
# how a Rust release build stays minutes rather than the hour QEMU makes of
# it; the per-architecture images are pushed by digest and joined into one
# multi-architecture tag by the last job.

name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The runtime an out-of-tree cell builds on (spec 039 B-3, B-4).
  RUNTIME_IMAGE: ghcr.io/${{ github.repository }}-runtime

jobs:
  build:
    name: build and smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Spec 039 B-4: docker/runtime.Dockerfile is this recipe's runtime
      # stage on its own, so the two must pin the same rauthy. A drift here
      # would ship a cell and a runtime with different identity providers.
      - name: One runtime
        run: |
          set -euo pipefail
          cell="$(grep -m1 '^ARG RAUTHY_IMAGE=' docker/Dockerfile)"
          runtime="$(grep -m1 '^ARG RAUTHY_IMAGE=' docker/runtime.Dockerfile)"
          if [ "$cell" != "$runtime" ]; then
            echo "docker/Dockerfile pins $cell" >&2
            echo "docker/runtime.Dockerfile pins $runtime" >&2
            exit 1
          fi

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: rahi:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # B-6 and FR-005: a temp volume, /readyz within the budget, discovery
      # fetched through the proxy, the issuer asserted to be the public URL,
      # and a clean exit on SIGTERM. The same script runs locally (AC-2).
      - name: Smoke test
        run: docker/smoke.sh rahi:smoke 18443

      # Spec 039 FR-004: the reference app's image serves its page, which is
      # what B-5's copy into RAHI_STATIC_DIR is for.
      - name: Build hello-cell's image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: hello-cell:smoke
          build-args: |
            RAHI_PACKAGE=hello-cell
            RAHI_BIN=hello-cell
            RAHI_STATIC_SRC=apps/hello-cell/web
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Smoke hello-cell, page included
        env:
          SMOKE_PAGE: "1"
        run: docker/smoke.sh hello-cell:smoke 18444

      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Push the runtime by digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: push_runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/runtime.Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.RUNTIME_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          mkdir -p /tmp/runtime-digests
          runtime="${{ steps.push_runtime.outputs.digest }}"
          touch "/tmp/runtime-digests/${runtime#sha256:}"

      - name: Upload the digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload the runtime digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: runtime-digest-${{ matrix.arch }}
          path: /tmp/runtime-digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: publish the multi-architecture tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/runtime-digests
          pattern: runtime-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Spec 039 B-3: a tag publishes the cell image and the runtime under
      # the version it names, and never `latest` (039 D-3).
      - name: Create and push the manifest lists
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          refs=""
          for d in /tmp/digests/*; do
            refs="$refs ${IMAGE}@sha256:$(basename "$d")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "${IMAGE}:${tag}" \
            -t "${IMAGE}:${tag#v}" \
            $refs
          docker buildx imagetools inspect "${IMAGE}:${tag}"

          runtime_refs=""
          for d in /tmp/runtime-digests/*; do
            runtime_refs="$runtime_refs ${RUNTIME_IMAGE}@sha256:$(basename "$d")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "${RUNTIME_IMAGE}:${tag}" \
            -t "${RUNTIME_IMAGE}:${tag#v}" \
            $runtime_refs
          docker buildx imagetools inspect "${RUNTIME_IMAGE}:${tag}"
