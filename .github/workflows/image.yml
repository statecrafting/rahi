# The image workflow (spec 031 B-6): build the container on main and on
# tags, smoke it against a real rauthy, and push it on tags only.
#
# This workflow publishes no PR status check and sits outside the ci-gate
# chain (spec 001 D-9): a release artifact is built after the gate, not as
# part of it. Each architecture builds on its own native runner, which is
# how a Rust release build stays minutes rather than the hour QEMU makes of
# it; the per-architecture images are pushed by digest and joined into one
# multi-architecture tag by the last job.

name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The runtime an out-of-tree cell builds on (spec 039 B-3, B-4).
  RUNTIME_IMAGE: ghcr.io/${{ github.repository }}-runtime
  # The reference app, which 039 AC-3 runs 034's AC-2 procedure against
  # (039 D-14). `publish = false` keeps the crate off crates.io; the image
  # is what the criterion names.
  HELLO_IMAGE: ghcr.io/${{ github.repository }}-hello-cell

jobs:
  build:
    name: build and smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Spec 039 B-4: docker/runtime.Dockerfile is this recipe's runtime
      # stage on its own, so the two must pin the same rauthy. A drift here
      # would ship a cell and a runtime with different identity providers.
      - name: One runtime
        run: |
          set -euo pipefail
          cell="$(grep -m1 '^ARG RAUTHY_IMAGE=' docker/Dockerfile)"
          runtime="$(grep -m1 '^ARG RAUTHY_IMAGE=' docker/runtime.Dockerfile)"
          if [ "$cell" != "$runtime" ]; then
            echo "docker/Dockerfile pins $cell" >&2
            echo "docker/runtime.Dockerfile pins $runtime" >&2
            exit 1
          fi

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: rahi:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # B-6 and FR-005: a temp volume, /readyz within the budget, discovery
      # fetched through the proxy, the issuer asserted to be the public URL,
      # and a clean exit on SIGTERM. The same script runs locally (AC-2).
      - name: Smoke test
        run: docker/smoke.sh rahi:smoke 18443

      # Spec 039 FR-004: the reference app's image serves its page, which is
      # what B-5's copy into RAHI_STATIC_DIR is for.
      - name: Build hello-cell's image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: hello-cell:smoke
          build-args: |
            RAHI_PACKAGE=hello-cell
            RAHI_BIN=hello-cell
            RAHI_STATIC_SRC=apps/hello-cell/web
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Smoke hello-cell, page included
        env:
          SMOKE_PAGE: "1"
        run: docker/smoke.sh hello-cell:smoke 18444

      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Push the runtime by digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: push_runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/runtime.Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.RUNTIME_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Spec 039 AC-3 and D-14: the criterion runs 034's AC-2 procedure
      # against the *published* hello-cell image, so the tag has to publish
      # one. The smoke build above proves the page; this publishes the same
      # recipe under a version a consumer can pull.
      - name: Push hello-cell by digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: push_hello
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.HELLO_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            RAHI_PACKAGE=hello-cell
            RAHI_BIN=hello-cell
            RAHI_STATIC_SRC=apps/hello-cell/web
          cache-from: type=gha,scope=${{ matrix.arch }}

      # Spec 039 AC-2, AC-3 and D-15. Everything above this point smokes a
      # locally loaded build; the push steps build again. Two builds of one
      # recipe are very probably identical and that is not the property the
      # criteria name, so each published artifact is now pulled back by its
      # digest and exercised as itself. These steps run in the matrix job,
      # which is a native runner for its architecture, so the evidence is
      # native execution bound to one platform digest and says nothing
      # about the other.
      - name: Smoke the published cell digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          ref="${IMAGE}@${{ steps.push.outputs.digest }}"
          docker pull "$ref"
          docker tag "$ref" rahi:published
          echo "::notice::cell ${{ matrix.arch }} digest ${{ steps.push.outputs.digest }}"
          docker/smoke.sh rahi:published 18446

      # B-4: the runtime carries no cell, so it cannot boot alone and a
      # boot check would be the wrong instrument. What it claims is its
      # contents and that a consumer can build on it, so both are asserted
      # against the pushed digest.
      - name: Verify the published runtime digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          ref="${RUNTIME_IMAGE}@${{ steps.push_runtime.outputs.digest }}"
          docker pull "$ref"
          echo "::notice::runtime ${{ matrix.arch }} digest ${{ steps.push_runtime.outputs.digest }}"

          # No cell: the runtime is the stage without one.
          if docker run --rm --entrypoint sh "$ref" -c 'test -e /usr/local/bin/rahi'; then
            echo "the runtime image carries a cell binary" >&2; exit 1
          fi
          # The pinned rauthy, the static slot, and the entrypoint.
          docker run --rm --entrypoint sh "$ref" -c 'test -x /usr/local/bin/rauthy'
          docker run --rm --entrypoint sh "$ref" -c 'test -d /usr/local/share/rahi/static'
          docker run --rm --entrypoint sh "$ref" -c \
            '[ -z "$(ls -A /usr/local/share/rahi/static)" ]'
          docker run --rm --entrypoint sh "$ref" -c 'test -x /usr/local/bin/entrypoint.sh'
          # Non-root, and the environment a consumer inherits.
          [ "$(docker run --rm --entrypoint sh "$ref" -c 'id -u')" = "10001" ]
          docker run --rm --entrypoint sh "$ref" -c \
            '[ "$RAHI_STATIC_DIR" = /usr/local/share/rahi/static ]'
          docker run --rm --entrypoint sh "$ref" -c \
            '[ "$RAHI_RAUTHY_BIN" = /usr/local/bin/rauthy ]'
          docker run --rm --entrypoint sh "$ref" -c '[ "$RAHI_DATA_DIR" = /data ]'

      # B-4's actual claim: a cell in another repository adds its binary at
      # /usr/local/bin/rahi and its page at the static dir, and the result
      # runs. Composed here from the two published digests, so the runtime
      # is proven by use and not only by inspection.
      - name: Compose a consumer on the published runtime digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SMOKE_PAGE: "1"
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer-image/web
          echo '<!doctype html><title>consumer</title>ok' > /tmp/consumer-image/web/index.html
          {
            echo "FROM ${RUNTIME_IMAGE}@${{ steps.push_runtime.outputs.digest }}"
            echo "COPY --from=${IMAGE}@${{ steps.push.outputs.digest }} /usr/local/bin/rahi /usr/local/bin/rahi"
            echo "COPY web/ /usr/local/share/rahi/static/"
          } > /tmp/consumer-image/Dockerfile
          cat /tmp/consumer-image/Dockerfile
          docker buildx build --load -t consumer-on-runtime:published /tmp/consumer-image
          docker/smoke.sh consumer-on-runtime:published 18447

      # The artifact AC-3 is run against must be the artifact that was
      # tested, not a second build of the same recipe.
      - name: Smoke the published hello-cell digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SMOKE_PAGE: "1"
        run: |
          set -euo pipefail
          ref="${HELLO_IMAGE}@${{ steps.push_hello.outputs.digest }}"
          docker pull "$ref"
          docker tag "$ref" hello-cell:published
          echo "::notice::hello-cell ${{ matrix.arch }} digest ${{ steps.push_hello.outputs.digest }}"
          docker/smoke.sh hello-cell:published 18445

      - name: Record the digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          mkdir -p /tmp/runtime-digests
          runtime="${{ steps.push_runtime.outputs.digest }}"
          touch "/tmp/runtime-digests/${runtime#sha256:}"
          mkdir -p /tmp/hello-digests
          hello="${{ steps.push_hello.outputs.digest }}"
          touch "/tmp/hello-digests/${hello#sha256:}"

      - name: Upload the digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload the runtime digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: runtime-digest-${{ matrix.arch }}
          path: /tmp/runtime-digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload the hello-cell digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: hello-digest-${{ matrix.arch }}
          path: /tmp/hello-digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: publish the multi-architecture tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/runtime-digests
          pattern: runtime-digest-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/hello-digests
          pattern: hello-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Spec 039 B-3: a tag publishes the cell image and the runtime under
      # the version it names, and never `latest` (039 D-3).
      - name: Create and push the manifest lists
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          refs=""
          for d in /tmp/digests/*; do
            refs="$refs ${IMAGE}@sha256:$(basename "$d")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "${IMAGE}:${tag#v}" \
            $refs
          docker buildx imagetools inspect "${IMAGE}:${tag#v}"

          runtime_refs=""
          for d in /tmp/runtime-digests/*; do
            runtime_refs="$runtime_refs ${RUNTIME_IMAGE}@sha256:$(basename "$d")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "${RUNTIME_IMAGE}:${tag#v}" \
            $runtime_refs
          docker buildx imagetools inspect "${RUNTIME_IMAGE}:${tag#v}"

          # Spec 039 AC-3 (D-14): the reference app under the same version.
          hello_refs=""
          for d in /tmp/hello-digests/*; do
            hello_refs="$hello_refs ${HELLO_IMAGE}@sha256:$(basename "$d")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "${HELLO_IMAGE}:${tag#v}" \
            $hello_refs
          docker buildx imagetools inspect "${HELLO_IMAGE}:${tag#v}"

      # Spec 039 B-3 and D-15: "both architectures" is a property of the
      # manifest list, and each platform digest was verified natively in its
      # own matrix job. Assert the list actually carries both, so a tag that
      # silently published one architecture fails here rather than being
      # discovered by a consumer on the other.
      - name: Each tag carries both architectures
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for image in "${IMAGE}" "${RUNTIME_IMAGE}" "${HELLO_IMAGE}"; do
            platforms="$(docker buildx imagetools inspect "${image}:${tag}" --raw \
              | jq -r '.manifests[] | select(.platform.os == "linux")
                       | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"
            echo "${image}:${tag} -> $(echo "$platforms" | tr '\n' ' ')"
            echo "$platforms" | grep -qx 'linux/amd64' \
              || { echo "${image}:${tag} has no linux/amd64" >&2; exit 1; }
            echo "$platforms" | grep -qx 'linux/arm64' \
              || { echo "${image}:${tag} has no linux/arm64" >&2; exit 1; }
          done
