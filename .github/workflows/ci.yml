# The supply-chain gate (spec 001 B-3, D-17). Since the adoption of the
# Statecraft setup profile `github-actions-rust` revision 7, the one required
# status check is the profile's `ci-gate` in `statecraft-ci.yml`, which runs
# governance and the cargo gate itself. This workflow and `govern.yml` are
# REUSABLE workflows declared in `.statecraft/environment.json` under
# `ci.extra_required_jobs`, so that `ci-gate` needs them and blocks on a
# failed, cancelled or skipped run exactly as for its own jobs.
#
# cargo-deny was folded into the old `ci-gate` job of this file and was
# therefore required; it stays required here. The old `ci-gate` job is gone:
# its name is the profile's.
name: ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deny:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
