# The release workflow (spec 039 B-2, B-6, B-7, AC-4).
#
# Four jobs. `package` proves every chassis crate can be published, on every
# pull request, so packaging never breaks quietly between releases.
# `consumer` proves the stanza a consumer writes before a version exists:
# the cell in `.github/consumer-cell/`, built outside this workspace against
# a git ref of this repository, boots, writes through the kernel, is denied,
# and verifies its chain.
#
# On a `v*` tag two more run. `publish-crates` publishes the nine chassis
# crates to crates.io in dependency order, and `consumer-registry` then
# proves the registry stanza (AC-4), which is the one aicortex pins. Both
# run the same `prove.sh` over the same cell, so the two stanzas carry the
# same evidence.
#
# The human's step at the release checkpoint is the tag (039 D-11, which
# supersedes the mechanism of B-2's last sentence and D-8 on the owner's
# decision of 2026-09-16): they tag, and the tag publishes the crates here
# and the images in `image.yml`. `publish-crates` is idempotent, so
# re-pushing a tag after a partial release is safe.

name: release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rev:
        description: "The commit or tag the consumer cell pins (defaults to this ref)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: cargo package (the nine chassis crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Spec 039 B-6 and FR-001: every chassis crate packages. `rahi-ops`
      # used to fail here, because it included a template from outside its
      # own directory, and that blocked `rahi-cli` with it.
      - name: Package the workspace
        run: cargo package --workspace --locked

      - name: Every chassis crate is packaged at the workspace version
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "workspace version ${version}"
          for crate in rahi-types rahi-store rahi-ledger rahi-kernel rahi-idp \
                       rahi-edge rahi-ops rahi-cli rahi-harness; do
            test -f "target/package/${crate}-${version}.crate" \
              || { echo "no package for ${crate} ${version}" >&2; exit 1; }
          done
          echo "nine chassis crates packaged at ${version}"

      # Spec 039 B-1: the path dependencies carry the same version, because
      # that is the version a published crate asks for.
      - name: The workspace dependencies name the workspace version
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          bad="$(grep -E '^rahi-[a-z]+ = \{ path = ' Cargo.toml | grep -v "version = \"${version}\"" || true)"
          if [ -n "$bad" ]; then
            echo "these dependencies do not name ${version}:" >&2
            echo "$bad" >&2
            exit 1
          fi

      # Spec 039 B-2: a tag names the version the crates carry.
      - name: The tag names the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#v}"
          [ "$tag" = "$version" ] \
            || { echo "tag ${GITHUB_REF_NAME} does not name version ${version}" >&2; exit 1; }

  consumer:
    name: the consumer stanza
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Spec 039 B-7: the stanza available before publication is a git
      # dependency on a tag. Once a release is published the same job proves
      # the registry stanza (D-1), which is the one aicortex pins.
      - name: Assemble the cell outside the workspace
        env:
          # Through the environment, never interpolated into the script: a
          # dispatch input is a string somebody types.
          REV: ${{ inputs.rev }}
        run: |
          set -euo pipefail
          rev="${REV:-}"
          if [ -z "$rev" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then rev="${GITHUB_REF_NAME}"; else rev="${GITHUB_SHA}"; fi
          fi
          key=rev
          case "$rev" in v[0-9]*) key=tag ;; esac
          echo "the consumer pins ${key} = ${rev}"
          mkdir -p /tmp/consumer
          cp -a .github/consumer-cell/. /tmp/consumer/
          sed -e "s|__REPO__|https://github.com/${GITHUB_REPOSITORY}|g" \
              -e "s|__KEY__|${key}|g" \
              -e "s|__REV__|${rev}|g" \
              /tmp/consumer/Cargo.toml.in > /tmp/consumer/Cargo.toml
          rm /tmp/consumer/Cargo.toml.in /tmp/consumer/Cargo.registry.toml.in
          cat /tmp/consumer/Cargo.toml

      - name: Build, boot, and govern it
        working-directory: /tmp/consumer
        run: ./prove.sh

  # Spec 039 D-11: the tag publishes. Nine crates, leaf first, each waiting
  # on the index before the next resolves its version dependency. Gated on
  # `package` and `consumer`, so nothing reaches crates.io until this tag
  # has proven it packages and composes.
  publish-crates:
    name: publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, consumer]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: The token is present
        run: |
          set -euo pipefail
          [ -n "${CARGO_REGISTRY_TOKEN:-}" ] \
            || { echo "CARGO_REGISTRY_TOKEN is not set on this repository" >&2; exit 1; }

      # Dependency order (039 D-8): types, store, ledger, kernel, then idp
      # and edge over the kernel, then ops over idp, then cli over both.
      # rahi-harness depends on no chassis crate and goes last.
      - name: Publish the nine chassis crates
        run: |
          set -euo pipefail
          for crate in rahi-types rahi-store rahi-ledger rahi-kernel rahi-idp \
                       rahi-edge rahi-ops rahi-cli rahi-harness; do
            echo "::group::publish ${crate}"
            .github/publish-crate.sh "${crate}"
            echo "::endgroup::"
          done
          echo "nine chassis crates published at ${GITHUB_REF_NAME#v}"

  # Spec 039 AC-4: after publication the nine crates resolve from crates.io
  # at the tag's version, and this workflow proves the registry stanza.
  consumer-registry:
    name: the consumer stanza, from crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the cell outside the workspace
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "the consumer pins = ${version} from crates.io"
          mkdir -p /tmp/consumer-registry
          cp -a .github/consumer-cell/. /tmp/consumer-registry/
          sed -e "s|__VER__|${version}|g" \
              /tmp/consumer-registry/Cargo.registry.toml.in > /tmp/consumer-registry/Cargo.toml
          rm /tmp/consumer-registry/Cargo.toml.in /tmp/consumer-registry/Cargo.registry.toml.in
          cat /tmp/consumer-registry/Cargo.toml

      - name: Build, boot, and govern it
        working-directory: /tmp/consumer-registry
        run: ./prove.sh
