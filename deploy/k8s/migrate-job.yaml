# Migrations are a Job, run once, before the rollout (spec 032 B-6). The
# Job runs the new image as a pure client of the running cluster
# (RAHI_STORE_CLIENT, spec 030 `migrate` through the peers in
# RAHI_HIQ_NODES): it has no volume and starts no node, and hiqlite routes
# the migration to the leader. Apply it with the new image tag, wait for
# completion, then roll the StatefulSet.
#
# On a fresh cluster there is nothing to reach yet: the pods' own start
# runs `rahi migrate --adopt-manifest` (the image's entrypoint, spec 031
# B-3), so this Job is for every rollout after the first.
#
# The Job adopts the manifest too (spec 036 B-3 and B-10): one transition per
# deploy, appended here on the leader, before the rollout. Replicas still on
# the old image keep serving and keep stamping the old hash on their
# decisions; one that restarts on the old image after this Job has run
# refuses to boot rather than serve a ceiling the chain no longer names.
#
# Then it records the deployment epoch (spec 041 B-5): the image it runs,
# measured, and what the rollout declares. Set RAHI_ARTIFACT_IMAGE to the
# digest-pinned image this Job runs, and RAHI_DEPLOYMENT_REFS to the
# rollout's typed references ({"build": {...}, "deployment": {...},
# "authority": {...}}, each {type, digest, id?}); both are optional, and
# the step appends one epoch only when something it names changed.
apiVersion: batch/v1
kind: Job
metadata:
  name: rahi-migrate
  labels:
    app.kubernetes.io/name: rahi-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahi-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: ghcr.io/statecrafting/rahi
          command: ["rahi", "migrate", "--adopt-manifest"]
          env:
            - name: RAHI_STORE_CLIENT
              value: "true"
            - name: RAHI_DATA_DIR
              value: /data
            # Spec 041 B-2, B-3: what this rollout deploys, set per rollout.
            # Unset, the epoch records no image and no references.
            # - name: RAHI_ARTIFACT_IMAGE
            #   value: ghcr.io/statecrafting/rahi@sha256:<64 hex>
            # - name: RAHI_DEPLOYMENT_REFS
            #   value: '{"deployment": {"type": "<uri>", "digest": "sha256:<64 hex>"}}'
          envFrom:
            - configMapRef:
                name: rahi-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: keys
              mountPath: /data/keys
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: keys
          secret:
            secretName: rahi-keys
            defaultMode: 0400
