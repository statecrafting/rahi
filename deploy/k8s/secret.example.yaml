# The two Secrets the manifests reference (spec 032 B-2 and B-5). Neither
# is applied by the kustomization: both hold material the operator custodies.
#
# rahi-keys: every key of the deployment, minted once by
#
#   rahi first-boot --export > rahi-keys.yaml
#
# (run the image once, anywhere: `docker run --rm -e RAHI_PUBLIC_URL=https://x
# ghcr.io/bartekus/rahi first-boot --export`). The document is exactly this
# shape with real values, and it is applied before the first rollout so
# first boot finds the keys mounted and generates nothing. Keep the file
# where a restore can find it: a backup archive carries the same keys, but
# the archive is encrypted to backup.key, which is in here.
#
#   ledger.key          the Ed25519 seed that signs the decision chain (spec 013)
#   session.key         the HMAC key for session cookies (spec 022)
#   hiqlite.json        the app store's Raft secret, API secret, and at-rest keys (spec 011)
#   backup.key          the age X25519 identity backups are encrypted to (spec 030)
#   rauthy.json         rauthy's ENC_KEYS, its two hiqlite secrets, and the bootstrap admin (spec 031)
#   rauthy_admin_token  the bootstrap API key the supervisor registers the client with (spec 021)
apiVersion: v1
kind: Secret
metadata:
  name: rahi-keys
type: Opaque
data:
  ledger.key: "<base64>"
  session.key: "<base64>"
  hiqlite.json: "<base64>"
  backup.key: "<base64>"
  rauthy.json: "<base64>"
  rauthy_admin_token: "<base64>"
---
# rahi-s3: what `rahi backup --to s3://` reads (spec 030 B-5). Hetzner
# object storage is path-style at https://<region>.your-objectstorage.com.
apiVersion: v1
kind: Secret
metadata:
  name: rahi-s3
type: Opaque
stringData:
  RAHI_BACKUP_S3_ENDPOINT: https://fsn1.your-objectstorage.com
  RAHI_BACKUP_S3_REGION: fsn1
  RAHI_BACKUP_S3_ACCESS_KEY: "<access key>"
  RAHI_BACKUP_S3_SECRET_KEY: "<secret key>"
  RAHI_BACKUP_S3_PATH_STYLE: "true"
