# The headless Service gives every pod a stable name (rahi-<ordinal>.rahi-hl)
# for Raft peers (spec 032 B-1). The ClusterIP Service is what the Ingress
# and the ServiceMonitor reach: the app port only; the Raft and hiqlite API
# ports are reachable by name and never published.
apiVersion: v1
kind: Service
metadata:
  name: rahi-hl
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: rahi
  ports:
    - name: hiqlite-api
      port: 8300
    - name: hiqlite-raft
      port: 8400
    - name: rauthy-api
      port: 8200
    - name: rauthy-raft
      port: 8100
---
apiVersion: v1
kind: Service
metadata:
  name: rahi
spec:
  selector:
    app.kubernetes.io/name: rahi
  ports:
    - name: http
      port: 8443
      targetPort: http
