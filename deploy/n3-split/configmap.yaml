# Rahi's configuration in the split layout (spec 044). Each StatefulSet
# renders its own peers from its own headless Service (A-032).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahi-config
data:
  RAHI_PUBLIC_URL: https://cell.example.com
  RAHI_TRUSTED_PROXY_HOPS: "1"
  RAHI_HIQLITE_API_ADDR: 0.0.0.0:8300
  RAHI_HIQLITE_RAFT_ADDR: 0.0.0.0:8400
  RAHI_HIQ_NODES: |
    1 rahi-0.rahi-hl:8400 rahi-0.rahi-hl:8300
    2 rahi-1.rahi-hl:8400 rahi-1.rahi-hl:8300
    3 rahi-2.rahi-hl:8400 rahi-2.rahi-hl:8300
  # B-1, B-2: the one address rahi reaches Rauthy by, over its native TLS,
  # verified against the mounted CA. Never a pod address, never the ingress.
  RAHI_RAUTHY_MODE: remote
  RAHI_RAUTHY_URL: https://rauthy-internal.rahi.svc.cluster.local:8443
  RAHI_RAUTHY_CA: /etc/rahi/rauthy-ca/ca.pem
