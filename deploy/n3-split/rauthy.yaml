# Rauthy's StatefulSet (spec 044 A-031, A-032): the patched Rauthy image
# run directly, its environment from the `rauthy-env` Secret that
# `rahi first-boot --export` renders in remote mode, native TLS on 8443
# (B-2), node id from the pod ordinal (HQL_NODE_ID_FROM=k8s), peers fixed
# before first start, the cache on disk (B-8, proposal D-3).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rauthy
spec:
  serviceName: rauthy-hl
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: rauthy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rauthy
    spec:
      # B-8: measured at AC-4; until then the same unmeasured bound as rahi.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rauthy
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rauthy
      containers:
        - name: rauthy
          # The patched release spec 043 adopts, pinned by digest.
          image: ghcr.io/bartekus/rauthy-patched:0.36.2-patched.3@sha256:d75cac0f708f3e238c458b622fea2f0b7dda9b67e9435eeafa37698d88a2a3c8
          ports:
            - name: https
              containerPort: 8443
            - name: hiqlite-api
              containerPort: 8200
            - name: hiqlite-raft
              containerPort: 8100
          env:
            - name: HQL_CACHE_STORAGE_DISK
              value: "true"
          envFrom:
            - secretRef:
                name: rauthy-env
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tls
              mountPath: /tls
              readOnly: true
          # Liveness waits for the first health answer: a pod still binding
          # TLS and joining its hiqlite peers under OrderedReady is not dead,
          # and killing it would hold the set at rauthy-0.
          startupProbe:
            httpGet:
              path: /auth/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /auth/v1/ready
              port: https
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/v1/health
              port: https
              scheme: HTTPS
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tls
          secret:
            secretName: rauthy-tls
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
